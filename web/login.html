<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f4f1">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161f">
  <meta name="color-scheme" content="light dark">
  <title>Log in | Expensify</title>
  <meta name="description" content="Log in to Expensify or create an account to track spending and keep to a monthly budget.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6e5c'/%3E%3Cpath d='M9 22V10m7 12V14m7 8V8' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preload" href="./vendor/fonts/instrument-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./auth.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="auth-top">
    <a href="/" class="wordmark" translate="no">Expensify</a>
    <a href="/" class="btn btn-quiet">Back to home</a>
  </header>

  <main id="main" class="auth-main">
    <section class="panel auth-panel" aria-labelledby="auth-title">
      <h1 id="auth-title">Log in</h1>
      <p class="lede" id="auth-sub">Pick up where you left off.</p>

      <form id="auth-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required aria-describedby="pw-hint">
            <button type="button" class="btn btn-quiet" id="pw-toggle" aria-pressed="false" aria-controls="password">Show</button>
          </div>
          <p class="lede" id="pw-hint" hidden>Use at least 8 characters.</p>
        </div>
        <p class="auth-note lede" id="claim-note" hidden>The transactions already saved on this computer will move into this first account.</p>
        <p class="over auth-error" id="auth-error" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary" id="auth-submit">Log in</button>
      </form>

      <p class="auth-switch">
        <span id="switch-text">New to Expensify?</span>
        <a href="/login?mode=signup" id="switch-link">Create an account</a>
      </p>
    </section>
  </main>

  <script src="./login.js"></script>
</body>
</html>
